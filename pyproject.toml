[tool.black]
line-length = 79
target-version = ["py313"]
exclude = '''
/(
  | alembic
  | venv
  | .venv
  | __pycache__
)/
'''

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
warn_unused_ignores = true
warn_return_any = false
no_implicit_optional = true
exclude = '''
/(
  | migrations
  | venv
  | .venv
  | __pycache__
)/
'''
